<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quizclimb - Jeu de Quiz en équipe entre amis</title>
    <meta name="description" content="Quizclimb, le jeu de quiz en ligne à jouer en équipe entre amis : créez une partie, formez vos équipes et répondez en direct." />
    <link rel="canonical" href="https://quizclimb.duckdns.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Quizclimb - Jeu de Quiz en équipe entre amis" />
    <meta property="og:description" content="Créez une partie, formez vos équipes et répondez en direct sur Quizclimb." />
    <meta property="og:url" content="https://quizclimb.duckdns.org/" />
    <meta name="robots" content="index, follow" />
    <!-- Oswald 600 uniquement (pas 700 — bold plein en majuscules jugé peu lisible en
         revue UX, corrigé le 2026-07-26). Réservée aux contextes display (titres, scores,
         noms d'équipe) — jamais au corps de texte. Voir DESIGN.md#Typography. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&display=swap" rel="stylesheet" />
    <script>
      // Appliqué avant le premier paint (pas dans un composant React) pour
      // éviter un flash sombre->clair au chargement. Préférence utilisateur
      // explicite (bascule) prioritaire sur le réglage clair/sombre du système,
      // lui-même utilisé uniquement en l'absence de choix déjà mémorisé.
      (function () {
        try {
          var stored = localStorage.getItem('quizkw_theme')
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body class="bg-bg min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
